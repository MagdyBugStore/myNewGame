<html><body style="background:#111;margin:0"><canvas id=c></canvas><script src="data:text/javascript,"></script><script>
const img=new Image();img.onload=()=>{const c=document.getElementById("c");const S=4;c.width=img.width*S;c.height=img.height*S;const x=c.getContext("2d");x.imageSmoothingEnabled=false;x.drawImage(img,0,0,c.width,c.height);x.strokeStyle="rgba(255,0,0,.8)";x.font="16px monospace";x.fillStyle="#ff0";for(let r=0;r<7;r++)for(let col=0;col<8;col++){x.strokeRect(col*64*S,r*32*S,64*S,32*S);x.fillText(String(r*8+col),col*64*S+4,r*32*S+20);}document.title="ready";};img.src="ground/sand_64x32.png";</script></body></html>
